name: Require linked issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Skip bot-generated data sync PRs
    if: ${{ !startsWith(github.head_ref, 'auto/') && github.actor != 'dependabot[bot]' }}
    steps:
      - name: Check PR body for a closing keyword
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const re = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i;
            if (!re.test(body)) {
              core.setFailed(
                "Link the issue this PR solves with 'Closes #N' in the description. " +
                "CodeRabbit reviews the PR against that issue."
              );
            } else {
              core.info("Linked issue found.");
            }

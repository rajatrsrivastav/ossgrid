name: Sync LFX Mentorship Data

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Data Pipeline
        run: npx tsx scripts/fetch-lfx-data.ts

      - name: Verify Data Health & Integrity
        run: npx tsx scripts/audit-data.ts

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet public/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: sync LFX mentorship data'
          title: '[Automated] Sync LFX Mentorship Data'
          body: |
            🤖 Automated data sync from [cncf/mentoring](https://github.com/cncf/mentoring).

            This PR updates the LFX mentorship project data.
          branch: auto/sync-lfx-data
          delete-branch: true
          labels: automated,data-sync

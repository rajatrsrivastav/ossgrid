name: QA Verification Pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  qa-check:
    name: Run QA Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Data Integrity & Health Audit
        id: audit
        run: npx tsx scripts/audit-data.ts

      - name: 2. TypeScript Typecheck
        id: typecheck
        run: npx tsc --noEmit

      - name: 3. ESLint Code Quality
        id: lint
        run: npm run lint

      - name: 4. Production Build Verification
        id: build
        run: npm run build

      - name: Post QA Status Summary
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const issueNumber = context.issue?.number;
            if (!issueNumber) {
              core.info('No issue or pull request context found; skipping comment.');
              return;
            }

            const formatOutcome = (outcome) => {
              if (outcome === 'success') return '✅ Passed';
              if (outcome === 'failure') return '❌ Failed';
              if (outcome === 'skipped') return '⏭️ Skipped';
              return outcome ? `\`${outcome}\`` : '⏭️ Skipped';
            };

            const isSuccess = process.env.JOB_STATUS === 'success';
            const body = [
              '### 🛡️ Automated QA Gate Status',
              `- **Data Integrity Audit**: ${formatOutcome(process.env.AUDIT_OUTCOME)}`,
              `- **TypeScript Check**: ${formatOutcome(process.env.TYPECHECK_OUTCOME)}`,
              `- **ESLint**: ${formatOutcome(process.env.LINT_OUTCOME)}`,
              `- **Next.js Production Build**: ${formatOutcome(process.env.BUILD_OUTCOME)}`,
              '',
              isSuccess
                ? '✅ **All QA Quality Gates Passed!** Ready for human/Copilot review.'
                : '❌ **QA Failures Detected.** Please review the workflow logs.'
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              core.warning(`Failed to post QA comment: ${error.message}`);
            }

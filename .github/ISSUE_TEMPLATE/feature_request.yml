name: Feature or task
description: A new feature, UI change or task for an existing program.
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: program
    attributes:
      label: Program
      options:
        - All / landing page
        - LFX
        - GSoC
        - Proposals
        - Playbook
        - Tooling / CI
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is stuck, and on what?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements. CodeRabbit reviews linked PRs against these.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Anything a PR for this issue should NOT touch (e.g. hero layout).
